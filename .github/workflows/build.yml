name: CI

on: [push]

jobs:
  build:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node + pnpm versions come from mise.toml (single source of truth).
      - name: Set up toolchain
        uses: jdx/mise-action@v2

      # Cache the pnpm content-addressable store so installs are near-instant
      # on a lockfile hit instead of re-downloading every dependency.
      - name: Locate pnpm store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (lint + format)
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      # Verify the Next.js build compiles. We run `next build` directly to skip
      # the `prebuild` Notion index crawl, and SKIP_NOTION_STATIC_BUILD makes
      # getStaticPaths pre-render nothing so no page hits Notion at build time.
      # This keeps CI deterministic and offline; production builds on Vercel run
      # the full `pnpm build`.
      - name: Build
        run: pnpm exec next build
        env:
          SKIP_NOTION_STATIC_BUILD: 'true'
