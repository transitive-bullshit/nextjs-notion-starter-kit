allowBuilds:
  canvas: true
  core-js: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true

enablePrePostScripts: true

minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

minimumReleaseAgeExclude:
  - '@fisch0920/config'
  - lqip-modern
  - random
  - react-notion-x
  - notion-client
  - notion-types
  - notion-utils
  - notion-x-to-md@8.0.7 || 8.0.8
